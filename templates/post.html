{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article class="post">
    <header class="post-header">
        <h1>{{ post.title }}</h1>
        {% if post.date %}
        <div class="post-meta-row">
            <time class="post-meta" datetime="{{ post.date }}">{{ post.date }}</time>
        </div>
        {% endif %}
    </header>
    <div class="post-body">{{ content }}</div>
</article>

{% endblock content %}
