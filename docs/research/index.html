    <script>
        (function () {
            var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
            var key = "blog";
            if (path === "/about" || path === "/about.html") key = "about";
            else if (path === "/slides" || path === "/slides.html") key = "slides";
            else if (path === "/memex" || path === "/memex.html" || path.indexOf("/memex/") === 0) key = "memex";
            else if (path === "/" || path === "/index" || path === "/index.html" || /^\/page\/\d+$/.test(path)) key = "blog";
            else key = "";

            if (key) {
                var active = document.querySelector('.nav-links a[data-nav="' + key + '"]');
                if (active) active.setAttribute("aria-current", "page");
            }

            if (path === "/" || path === "/index" || path === "/index.html" || /^\/page\/\d+$/.test(path)) {
                sessionStorage.setItem("navTrail", "blog");
            } else if (
                path === "/about" || path === "/about.html" ||
                path === "/memex" || path === "/memex.html" ||
                path.indexOf("/memex/") === 0
            ) {
                sessionStorage.setItem("navTrail", "memex");
            }

            var dualArticle = document.querySelector('[data-memex-context="dual"]');
            if (!dualArticle) return;

            var trail = sessionStorage.getItem("navTrail");
            if (!trail && document.referrer) {
                try {
                    var refPath = new URL(document.referrer, location.href).pathname.replace(/\/+$/, "") || "/";
                    if (
                        refPath === "/about" || refPath === "/about.html" ||
                        refPath === "/memex" || refPath === "/memex.html" ||
                        refPath.indexOf("/memex/") === 0
                    ) {
                        trail = "memex";
                    } else {
                        trail = "blog";
                    }
                } catch (e) {
                    trail = "blog";
                }
            }
            trail = trail || "blog";

            if (trail === "memex") {
                dualArticle.classList.add("memex-page");
                var chrome = dualArticle.querySelector(".memex-chrome");
                if (chrome) chrome.hidden = false;
            }
        })();
    </script>
