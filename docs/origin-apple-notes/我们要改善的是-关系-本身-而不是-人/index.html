    </header>
    <div class="post-body"><p>这段关系，是否足够坦诚，让彼此能够及时表达自己的想法？ </p>
<p>这段关系，是否足够包容，让彼此可以接纳缺点和差异？ </p>
<p>这段关系，是否足够有活力，让彼此可以相互激发出更好的自己？</p>
<p>正能量主导，近距离关系精美且牢固，远距离关系走心且有活力。或许我的人际关系并不广，但是我对它无比赞赏心怀感恩。</p></div>

    <script>
        (function () {
            var toggle = document.getElementById("theme-toggle");
            if (!toggle) return;

            var root = document.documentElement;
            var updateLabel = function (theme) {
                toggle.setAttribute(
                    "aria-label",
                    theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
                );
            };

            updateLabel(root.getAttribute("data-theme") || "light");

            toggle.addEventListener("click", function () {
                var current = root.getAttribute("data-theme") || "light";
                var next = current === "dark" ? "light" : "dark";
                root.setAttribute("data-theme", next);
                localStorage.setItem("theme", next);
                updateLabel(next);
            });
        })();
    </script>
